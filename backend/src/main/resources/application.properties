spring.application.name=backend

# Database
# spring.datasource.url=jdbc:mysql://localhost:3306/insurance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.url=jdbc:mysql://localhost:3306/insurance_db?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=Crazy@2026
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA - Force create tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

server.port=${PORT:8080}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.web.resources.static-locations=file:uploads/claims/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.hibernate.SQL=DEBUG
logging.level.com.insurance=DEBUG
spring.web.resources.static-locations=file:uploads/
spring.mvc.static-path-pattern=/uploads/**
# Enable health endpoint
management.endpoint.health.enabled=true 
management.endpoints.web.exposure.include=*
# management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# Use same port as app (port 8080)
management.endpoints.web.base-path=/actuator
management.server.port=8080